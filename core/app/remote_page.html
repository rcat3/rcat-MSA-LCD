<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>RCAT Remote</title>
<style>
:root {
  --bg: #000; --surface: #1c1c1c; --outline: #3a3a3a; --track: #262626;
  --text: #fff; --muted: #8a8a8a; --accent: #e91e63; --ok: #4caf50; --stop: #d32f2f;
  --m0: #e91e63; --m1: #9c27b0; --m2: #00bcd4;
  --green: #33ff33; --green-dim: #1a8f1a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px 32px; max-width: 520px; margin: 0 auto;
  -webkit-user-select: none; user-select: none; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0 8px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
h1 .dot.off { background: var(--stop); }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase;
  letter-spacing: .08em; margin: 24px 0 8px; }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--outline);
  border-radius: 999px; padding: 4px; }
.tabs button { flex: 1; min-height: 40px; border: 0; background: transparent; color: var(--muted); padding: 8px; }
.tabs button.on { background: var(--outline); color: var(--text); }
.tab { display: none; }
.tab.on { display: block; }
.card { background: var(--surface); border: 1px solid var(--outline); border-radius: 18px;
  padding: 14px 16px; margin-bottom: 10px; }
.card .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.card .name { font-weight: 600; font-size: 18px; }
.muted { color: var(--muted); font-size: 14px; }
.motor { margin: 14px 0 6px; }
.motor .row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.motor .row b { color: var(--text); font-weight: 600; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px;
  background: transparent; margin: 2px 0; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px;
  background: linear-gradient(to right, var(--c) var(--p), var(--track) var(--p)); }
input[type=range]::-moz-range-track { height: 12px; border-radius: 6px;
  background: linear-gradient(to right, var(--c) var(--p), var(--track) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px;
  margin-top: -10px; border-radius: 50%; background: #fff; border: 4px solid var(--c); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%;
  background: #fff; border: 4px solid var(--c); }
.live { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin: 0 2px; }
.live i { display: block; height: 100%; width: 0; background: var(--c); transition: width .15s linear; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
button { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--outline);
  border-radius: 999px; padding: 12px 16px; min-height: 48px; cursor: pointer; }
button:active { background: var(--outline); }
button.on { border-color: var(--accent); color: var(--accent); }
button.ok { border-color: var(--ok); color: var(--ok); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.chips button { flex: none; min-height: 40px; padding: 8px 14px; font-size: 14px; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.speed { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 12px; }
.speed button { width: 48px; padding: 0; font-size: 22px; }
.speed span { min-width: 110px; text-align: center; color: var(--muted); }
.list button { display: flex; width: 100%; justify-content: space-between; margin-bottom: 8px;
  border-radius: 16px; text-align: left; }
.status { text-align: center; color: var(--muted); min-height: 22px; margin-top: 8px; }
.empty { color: var(--muted); text-align: center; padding: 18px 0; }

/* Screen */
.now { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.now button { width: 56px; height: 56px; padding: 0; font-size: 22px; flex: none; }
.now .where { flex: 1; text-align: center; min-width: 0; }
.now .where b { display: block; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feature .name { margin-bottom: 10px; display: block; }

/* Terminal */
.term, .term * { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
.crt { position: relative; margin-top: 16px; background: #020602; border: 1px solid #143814;
  border-radius: 18px; padding: 16px; min-height: 140px; overflow: hidden;
  color: var(--green); font-size: 18px; line-height: 1.3; text-shadow: 0 0 6px rgba(51,255,51,.7);
  white-space: pre-wrap; word-break: break-word; }
.crt::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.35) 2px 3px); }
.crt .label { color: var(--green-dim); font-size: 12px; letter-spacing: .15em; text-shadow: none; margin-bottom: 8px; }
.caret { display: inline-block; width: .6em; height: 1em; background: var(--green); vertical-align: -2px;
  box-shadow: 0 0 8px var(--green); animation: blink 1.06s steps(1) infinite; margin-left: 1px; }
@keyframes blink { 50% { opacity: 0; } }
textarea { width: 100%; min-height: 110px; margin-top: 12px; resize: vertical; background: #020602;
  color: var(--green); caret-color: var(--green); border: 1px solid var(--green-dim); border-radius: 14px;
  padding: 12px 14px; font-size: 18px; line-height: 1.3; outline: none;
  -webkit-user-select: text; user-select: text; text-shadow: 0 0 4px rgba(51,255,51,.5); }
textarea:focus { border-color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 16px rgba(51,255,51,.25); }
textarea::placeholder { color: var(--green-dim); text-shadow: none; }
.termrow { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.termrow .count { flex: 1; color: var(--green-dim); font-size: 13px; }
button.send { background: var(--green); color: #000; border-color: var(--green); font-weight: 700;
  letter-spacing: .1em; min-width: 120px; box-shadow: 0 0 14px rgba(51,255,51,.35); }
button.send:active { background: var(--green-dim); }
button.dim { color: var(--green); border-color: var(--green-dim); background: #020602; }
.toggles { display: flex; gap: 8px; margin-top: 10px; }
.toggles button { flex: 1; min-height: 42px; font-size: 14px; color: var(--green-dim); border-color: #143814; background: #020602; }
.toggles button.on { color: var(--green); border-color: var(--green); }
.sizes { display: flex; gap: 6px; margin-top: 10px; }
.sizes button { flex: 1; min-height: 42px; padding: 0; font-size: 13px; color: var(--green-dim);
  border-color: #143814; background: #020602; border-radius: 12px; }
.sizes button.on { color: var(--green); border-color: var(--green); box-shadow: 0 0 10px rgba(51,255,51,.25); }
.sizes button b { display: block; font-size: 15px; }
.history button { display: block; width: 100%; text-align: left; margin-bottom: 6px; border-radius: 12px;
  color: var(--green); border-color: #143814; background: #020602; font-size: 15px; min-height: 42px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#stop { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
  max-width: 488px; margin: 0 auto; height: 64px; border: 0; border-radius: 999px;
  background: var(--stop); color: #fff; font-size: 22px; font-weight: 700; letter-spacing: .1em;
  box-shadow: 0 0 0 6px var(--bg); z-index: 3; }
#stop:active { background: #9a0007; }
body.toys { padding-bottom: 104px; }
body:not(.toys) #stop { display: none; }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #333;
  color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 15px; opacity: 0;
  transition: opacity .2s; pointer-events: none; white-space: nowrap; z-index: 4; }
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>RCAT Remote</h1>
  <div class="tabs">
    <button data-tab="screen">Screen</button>
    <button data-tab="toys">Toys</button>
    <button data-tab="term">Terminal</button>
  </div>
</header>

<section class="tab" id="tab-screen">
  <div class="now">
    <button id="prev" aria-label="Previous page">&#9664;</button>
    <div class="where"><span class="muted" id="now-feature"></span><b id="now-page"></b></div>
    <button id="next" aria-label="Next page">&#9654;</button>
  </div>
  <h2>Show on the display</h2>
  <div id="features"></div>
</section>

<section class="tab" id="tab-toys">
  <div id="controls" style="margin-top:16px"></div>

  <h2>Patterns</h2>
  <div class="chips scroll" id="targets"></div>
  <div class="grid" id="patterns"></div>
  <div class="speed">
    <button id="slower" aria-label="Slower">&minus;</button>
    <span id="speed">Speed 100%</span>
    <button id="faster" aria-label="Faster">+</button>
  </div>

  <h2 id="react-title">React to</h2>
  <div class="grid" id="modes"></div>
  <div class="status" id="react-status"></div>

  <h2>Devices</h2>
  <div class="list" id="devices"></div>
  <button id="search" style="width:100%">Search</button>
</section>

<section class="tab term" id="tab-term">
  <div class="crt"><div class="label" id="crt-label">ON THE DISPLAY</div><span id="crt-text"></span><span class="caret"></span></div>
  <textarea id="msg" placeholder="&gt; type a message" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"></textarea>
  <div class="termrow">
    <span class="count" id="count"></span>
    <button class="dim" id="clear">CLEAR</button>
    <button class="send" id="send">SEND</button>
  </div>
  <div class="toggles">
    <button id="append">Add a line</button>
    <button id="showit">Switch to it</button>
  </div>
  <h2>Letter size</h2>
  <div class="sizes" id="sizes"></div>
  <div class="muted" id="size-note" style="margin-top:8px;font-size:13px"></div>
  <h2>Sent</h2>
  <div class="history" id="history"></div>
</section>

<button id="stop">STOP</button>
<div id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const colors = ["var(--m0)", "var(--m1)", "var(--m2)"];
let info = { patterns: [], modes: [], max_connected: 3, message_max: 600, features: [] };
let state = null;
let target = -1;                // where patterns play: -1 for every device
let online = true;
const dragging = new Set();     // sliders under a finger: the page leaves them alone
const pending = new Map();      // levels waiting to go out, newest only
let sending = false;

// Things remembered on this phone only
function load(key, fallback) {
  try { const v = localStorage.getItem("rcat." + key); return v === null ? fallback : JSON.parse(v); }
  catch (e) { return fallback; }
}
function save(key, value) { try { localStorage.setItem("rcat." + key, JSON.stringify(value)); } catch (e) {} }

function request(path, params, options) {
  const q = params ? "?" + new URLSearchParams(params) : "";
  return fetch("/api/" + path + q, Object.assign({ cache: "no-store" }, options))
    .then(r => r.json())
    .then(s => { setOnline(true); return s; })
    .catch(e => { setOnline(false); throw e; });
}
const api = (path, params, post) => request(path, params, { method: post ? "POST" : "GET" });
function command(path, params, body) {
  const options = { method: "POST" };
  if (body !== undefined) { options.body = body; options.headers = { "Content-Type": "text/plain; charset=utf-8" }; }
  return request(path, params, options).then(show).catch(() => {});
}

function setOnline(on) {
  if (on !== online) { online = on; $("dot").classList.toggle("off", !on); }
}

let toastTimer;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2500);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ----- Tabs ----- */

// The tab from the address (#screen, #toys or #term), or the last one used
let tab = ["screen", "toys", "term"].includes(location.hash.slice(1)) ? location.hash.slice(1) : load("tab", "toys");
function showTab(name) {
  tab = name;
  save("tab", name);
  for (const b of document.querySelectorAll(".tabs button")) b.classList.toggle("on", b.dataset.tab === name);
  for (const s of document.querySelectorAll(".tab")) s.classList.toggle("on", s.id === "tab-" + name);
  document.body.classList.toggle("toys", name === "toys");     // STOP is only on the toys tab
}
for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => showTab(b.dataset.tab);
showTab(tab);

/* ----- Screen ----- */

function buildScreen() {
  const box = $("features");
  box.replaceChildren();
  info.features.forEach(([name, pages], f) => {
    const card = el("div", "card feature");
    card.append(el("span", "name", name));
    const chips = el("div", "chips");
    pages.forEach((page, p) => {
      const b = el("button", "", page || "Page " + (p + 1));
      b.dataset.f = f; b.dataset.p = p;
      b.onclick = () => command("show", { f, p });
      chips.append(b);
    });
    card.append(chips);
    box.append(card);
  });
}

function showScreen() {
  const [f, p] = state.screen;
  const feature = info.features[f];
  $("now-feature").textContent = feature ? feature[0] : "";
  $("now-page").textContent = feature ? (feature[1][p] || "Page " + (p + 1)) : "";
  for (const b of $("features").querySelectorAll("button")) b.classList.toggle("on", +b.dataset.f === f && +b.dataset.p === p);
}

// Step through every page of every feature, in order, round and round
function step(by) {
  if (!state || info.features.length === 0) return;
  const all = [];
  info.features.forEach(([, pages], f) => pages.forEach((_, p) => all.push([f, p])));
  const at = all.findIndex(([f, p]) => f === state.screen[0] && p === state.screen[1]);
  const [f, p] = all[(at + by + all.length) % all.length];
  command("show", { f, p });
}
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

/* ----- Toys ----- */

// One level request at a time, sending the newest value for each motor,
// so a fast drag doesn't pile requests up.
function sendLevels() {
  if (sending || pending.size === 0) return;
  const [key, params] = pending.entries().next().value;
  pending.delete(key);
  sending = true;
  api("level", params, true).then(show).catch(() => {}).finally(() => { sending = false; sendLevels(); });
}
function setLevel(d, m, v, release) {
  const params = { d, m, v };
  if (release) params.release = 1;
  pending.set(d + "." + m, params);
  sendLevels();
}

const connected = () => state ? state.devices.filter(d => d.state === "connected") : [];

function fill(slider) {
  const p = slider.max > 0 ? 100 * slider.value / slider.max : 0;
  slider.style.setProperty("--p", p + "%");
}

// The motor controls, one card per connected device. They're rebuilt only
// when the devices or their motors change, so a slider isn't replaced mid-drag.
let controlsKey = "";
function showControls() {
  const devs = connected();
  const key = devs.map(d => d.slot + ":" + d.motors.map(m => m.kind + m.max).join()).join("|");
  const box = $("controls");
  if (key !== controlsKey) {
    controlsKey = key;
    box.replaceChildren();
    if (devs.length === 0) {
      box.append(el("div", "card empty", "Nothing connected yet. Search for devices below."));
    }
    for (const d of devs) {
      const card = el("div", "card");
      card.id = "dev" + d.slot;
      const top = el("div", "top");
      top.append(el("span", "name", d.model), el("span", "muted"));
      card.append(top);
      d.motors.forEach((m, i) => {
        const motor = el("div", "motor");
        motor.style.setProperty("--c", colors[i % colors.length]);
        const row = el("div", "row");
        row.append(el("span", "", m.kind), el("b"));
        const slider = el("input");
        slider.type = "range"; slider.min = 0; slider.max = m.max; slider.step = 1;
        const id = d.slot + "." + i;
        slider.addEventListener("pointerdown", () => dragging.add(id));
        slider.addEventListener("input", () => {
          dragging.add(id); fill(slider);
          row.lastChild.textContent = slider.value;
          setLevel(d.slot, i, slider.value, false);
        });
        const release = () => {
          if (!dragging.has(id)) return;
          dragging.delete(id);
          setLevel(d.slot, i, slider.value, true);
        };
        slider.addEventListener("change", release);
        slider.addEventListener("pointerup", release);
        slider.addEventListener("pointercancel", release);
        const live = el("div", "live");
        live.append(el("i"));
        motor.append(row, slider, live);
        card.append(motor);
      });
      box.append(card);
    }
  }
  for (const d of devs) {
    const card = $("dev" + d.slot);
    if (!card) continue;
    let note = d.battery >= 0 ? d.battery + "%" : "";
    if (d.pattern >= 0 && info.patterns[d.pattern]) note = "▶ " + info.patterns[d.pattern] + (note ? "  ·  " + note : "");
    card.querySelector(".top .muted").textContent = note;
    card.querySelectorAll(".motor").forEach((motor, i) => {
      const m = d.motors[i];
      const slider = motor.querySelector("input");
      const value = d.driven ? m.cap : m.level;
      if (!dragging.has(d.slot + "." + i) && !pending.has(d.slot + "." + i)) {
        slider.value = value; fill(slider);
        motor.querySelector(".row b").textContent = d.driven ? "up to " + value : value;
      }
      // While a pattern or reaction drives it, the slider sets how high it
      // goes, and the thin bar shows the level as it plays.
      motor.querySelector(".live").style.visibility = d.driven ? "visible" : "hidden";
      motor.querySelector(".live i").style.width = (m.max ? 100 * m.level / m.max : 0) + "%";
    });
  }
}

function playingOnTarget(p) {
  const devs = connected();
  if (target >= 0) { const d = devs.find(d => d.slot === target); return !!d && d.pattern === p; }
  return devs.length > 0 && devs.every(d => d.pattern === p);
}

let targetsKey = "";
function showPatterns() {
  const devs = connected();
  if (target >= 0 && !devs.some(d => d.slot === target)) target = -1;
  const key = target + "|" + devs.map(d => d.slot + d.model).join();
  if (key !== targetsKey) {
    targetsKey = key;
    const box = $("targets");
    box.replaceChildren();
    if (devs.length > 1) {
      const choices = [[-1, "All devices"]].concat(devs.map(d => [d.slot, d.model]));
      for (const [slot, name] of choices) {
        const b = el("button", slot === target ? "on" : "", name);
        b.onclick = () => { target = slot; showPatterns(); };
        box.append(b);
      }
    }
  }
  const buttons = $("patterns").children;
  for (let i = 0; i < buttons.length; i++) buttons[i].classList.toggle("on", playingOnTarget(i));
  $("speed").textContent = "Speed " + state.speed + "%";
}

function showModes() {
  const buttons = $("modes").children;
  for (const b of buttons) b.classList.toggle("on", +b.dataset.mode === state.react);
  $("react-status").textContent = state.react ? state.status : "";
}

function showDevices() {
  const box = $("devices");
  box.replaceChildren();
  for (const d of state.devices) {
    const b = el("button", d.state === "connected" ? "ok" : "");
    let right = { connecting: "…", failed: "failed", lost: "lost", found: "connect" }[d.state] || "";
    if (d.state === "connected") right = (d.battery >= 0 ? d.battery + "%  " : "") + "✓";
    b.append(el("span", "", d.state === "connected" ? d.model : d.name), el("span", "muted", right));
    b.onclick = () => command("connect", { d: d.slot });
    box.append(b);
  }
  if (state.devices.length === 0) box.append(el("div", "empty", state.scan ? "Searching…" : "No devices found yet"));
  $("search").textContent = state.scan ? "Searching…" : "Search";
  $("search").classList.toggle("on", !!state.scan);
}

/* ----- Terminal ----- */

let append = load("append", false);
let showIt = load("show", true);
let history = load("history", []);

function showToggles() {
  $("append").classList.toggle("on", append);
  $("showit").classList.toggle("on", showIt);
  $("append").textContent = append ? "✓ Add a line" : "Add a line";
  $("showit").textContent = showIt ? "✓ Switch to it" : "Switch to it";
}
$("append").onclick = () => { append = !append; save("append", append); showToggles(); };
$("showit").onclick = () => { showIt = !showIt; save("show", showIt); showToggles(); };

function showCount() {
  $("count").textContent = $("msg").value.length + " / " + info.message_max;
}
$("msg").addEventListener("input", showCount);

function showHistory() {
  const box = $("history");
  box.replaceChildren();
  for (const text of history) {
    const b = el("button", "", "> " + text.replace(/\n/g, " "));
    b.onclick = () => sendText(text);
    box.append(b);
  }
  if (history.length === 0) box.append(el("div", "muted", "Nothing yet. Tap one to send it again."));
}

function sendText(text) {
  if (!text.trim()) return;
  command("message", { append: append ? 1 : 0, show: showIt ? 1 : 0 }, text);
  history = [text].concat(history.filter(t => t !== text)).slice(0, 8);
  save("history", history);
  showHistory();
}
$("send").onclick = () => { sendText($("msg").value); $("msg").value = ""; showCount(); };
// Enter sends; Shift+Enter starts a new line
$("msg").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("send").onclick(); }
});
$("clear").onclick = () => command("clear");

// Letter sizes: Auto fits the message, the others are 8 to 48 px
const sizes = [[0, "Auto", "fit"], [1, "8", "px"], [2, "16", "px"], [3, "24", "px"], [4, "32", "px"], [5, "40", "px"], [6, "48", "px"]];
for (const [s, big, small] of sizes) {
  const b = el("button");
  b.dataset.size = s;
  b.append(el("b", "", big), el("span", "", small));
  b.onclick = () => command("termsize", { s });
  $("sizes").append(b);
}

function showTerminal() {
  $("crt-text").textContent = state.message || "> ";
  for (const b of $("sizes").children) b.classList.toggle("on", +b.dataset.size === state.term_size);
  const px = state.term_scale * 8;
  $("crt-label").textContent = "ON THE DISPLAY" + (px ? " \u00B7 " + px + " PX" : "");
  $("size-note").textContent = state.term_size === 0
    ? "Auto uses the biggest letters the whole message fits in, down to 16 px. Longer messages scroll."
    : "Messages too long for this size scroll, keeping the newest lines.";
}

/* ----- Everything ----- */

function show(s) {
  state = s;
  if (s.notice) toast(s.notice);
  showScreen();
  showControls();
  showPatterns();
  showModes();
  showDevices();
  showTerminal();
}

function build() {
  const grid = $("patterns");
  info.patterns.forEach((name, i) => {
    const b = el("button", "", name);
    b.onclick = () => {
      if (connected().length === 0) { toast("Connect a device first"); return; }
      command("play", { d: target, p: playingOnTarget(i) ? -1 : i });
    };
    grid.append(b);
  });
  const modes = $("modes");
  for (const [id, name] of info.modes) {
    const b = el("button", "", name);
    b.dataset.mode = id;
    b.onclick = () => command("react", { m: state && state.react === id ? 0 : id });
    modes.append(b);
  }
  if (info.modes.length === 0) { $("react-title").hidden = true; }
  $("msg").maxLength = info.message_max;
  buildScreen();
  // No Terminal on this board: leave its tab out
  if (!info.features.some(([name]) => name === "Terminal")) {
    document.querySelector('.tabs button[data-tab="term"]').hidden = true;
    if (tab === "term") showTab("toys");
  }
}

$("slower").onclick = () => command("speed", { v: Math.max(25, state.speed - 25) });
$("faster").onclick = () => command("speed", { v: Math.min(300, state.speed + 25) });
$("search").onclick = () => command("scan", { on: 1 });
// Stop as soon as it's touched, not when the finger lifts
$("stop").addEventListener("pointerdown", e => { e.preventDefault(); pending.clear(); command("stop"); });

let polling = false;
function poll() {
  if (polling || sending || document.hidden) return;
  polling = true;
  api("state").then(show).catch(() => {}).finally(() => { polling = false; });
}

showToggles();
showHistory();
showCount();
api("info").then(i => { info = i; build(); showCount(); }).catch(() => {}).finally(() => {
  poll();
  setInterval(poll, 400);
});
</script>
</body>
</html>
